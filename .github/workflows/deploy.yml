name: Build and deploy to Napoleon

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build (fetch cases from Sanity, generate pages)
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='scripts/' \
            --exclude='instrucoes/' \
            --exclude='screenshots/' \
            --exclude='dist/' \
            --exclude='case.template.html' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vercel.json' \
            --exclude='.DS_Store' \
            ./ dist/

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_HOST }}
          port: 1157
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ secrets.FTP_REMOTE_DIR }}
          sftp_only: true
